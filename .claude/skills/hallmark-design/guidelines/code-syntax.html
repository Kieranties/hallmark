<!-- @dsCard group="Code" viewport="700x170" name="Syntax palette" subtitle="--code-* tokens, muted and low-chroma" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}code,pre{font-family:var(--font-mono);font-variant-ligatures:none}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px 18px;font-size:12px">
<div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-keyword)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">keyword</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-string)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">string</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-number)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">number</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-function)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">function</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-property)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">property</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-comment)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">comment</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-tag)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">tag</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-attr)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">attr-name</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-punctuation)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">punctuation</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-added)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">added</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-removed)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">removed</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:var(--code-line-number)"></span><span style="font-family:var(--font-mono);color:var(--text-muted)">line number</span></div>
</div>
<p style="margin:14px 0 0;font-size:13px;color:var(--text-muted)">Inline code marks are gold; syntax colour is deliberately quieter than the prose marks around it — a mark should always out-shout a keyword.</p>
</body></html>
