<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="One easing, two durations" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted)"><div><code>--duration-fast 140ms</code> — hover, focus, colour</div><div><code>--duration-base 220ms</code> — disclosure, theme swap</div><div><code>--ease-standard cubic-bezier(.2,0,.2,1)</code> — everything</div><div>No bounce, no overshoot, no entrance animation on docs content.</div></div></body></html>
