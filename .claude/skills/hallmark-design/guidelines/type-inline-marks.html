<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><p style="margin:0;font-size:16px;line-height:1.8;max-width:64ch">A defined term reads as <a href="#" style="color:var(--text-mark);font-weight:500;text-decoration:none;border-bottom:1px dotted var(--border-mark)">actor</a>, a keyword as <span style="background:var(--accent-soft);color:var(--text-mark);font-weight:500;padding:0 3px">concession</span>, an identifier as <code style="font-family:var(--font-mono);font-size:.88em;background:var(--bg-code);color:var(--text-code);border:1px solid var(--border-subtle);border-radius:2px;padding:1px 5px">Accepted</code>, and a link as <a href="#" style="color:var(--text-link);text-decoration:none;border-bottom:1px solid var(--border-link)">the sift</a>.</p></body></html>
