<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="120 / 180 / 280ms, cubic-bezier(.2,0,.2,1). No bounce." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.m{flex:1;border:var(--hm-border);border-radius:var(--hm-radius-3);padding:10px;display:flex;flex-direction:column;gap:8px;transition:var(--hm-transition-colors)}
.m:hover{background:var(--hm-surface-sunk);border-color:var(--hm-line-accent)}
.p{display:inline-block;padding:6px 12px;border:var(--hm-border-strong);border-radius:var(--hm-radius-2);font-family:var(--hm-font-mono);font-size:var(--hm-size-code-sm);transition:transform var(--hm-duration-instant) var(--hm-ease-standard)}
.p:active{transform:var(--hm-press-translate)}</style></head>
<body><div class="row" style="gap:14px">
<div class="m"><span class="k">hover · 120ms</span><span style="color:var(--hm-text-muted)">colour only</span></div>
<div class="m"><span class="k">press · 80ms</span><span class="p">translateY(1px)</span></div>
<div class="m"><span class="k">reveal · 180ms</span><span style="color:var(--hm-text-muted)">opacity + 2px rise</span></div>
<div class="m"><span class="k">reduced motion</span><span style="color:var(--hm-text-muted)">all durations → 0</span></div>
</div></body></html>
