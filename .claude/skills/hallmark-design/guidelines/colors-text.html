<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--grey-1);color:#fff">1 · body</div><div style="background:var(--grey-2);color:#fff">2</div><div style="background:var(--grey-3);color:#fff">3 · muted</div><div style="background:var(--grey-4);color:#16181C">4 · faint</div><div style="background:var(--grey-5);color:#16181C">5</div><div style="background:var(--grey-6);color:#16181C">6</div></div></body></html>
