<!-- @dsCard group="Spacing" viewport="700x200" name="Docs frame" subtitle="270px sidebar · 70ch prose · 220px TOC · 60px navbar" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.f{border:var(--hm-border);border-radius:var(--hm-radius-3);overflow:hidden}.nav{height:34px;border-bottom:var(--hm-border);background:var(--hm-surface-card);display:flex;align-items:center;padding:0 12px}.body{display:grid;grid-template-columns:150px 1fr 120px;height:110px}.body>div{padding:8px 10px}.sb{border-right:var(--hm-border);background:var(--hm-surface-sunk)}.toc{border-left:var(--hm-border)}.lines span{display:block;height:6px;background:var(--hm-ink-200);border-radius:2px;margin-bottom:6px}</style></head>
<body><div class="f">
<div class="nav"><span class="k">navbar · 60px</span></div>
<div class="body">
<div class="sb"><span class="k">sidebar 270</span><div class="lines" style="margin-top:8px"><span style="width:70%"></span><span style="width:85%"></span><span style="width:60%"></span></div></div>
<div><span class="k">prose · max 70ch</span><div class="lines" style="margin-top:8px"><span style="width:100%"></span><span style="width:96%"></span><span style="width:88%"></span><span style="width:70%"></span></div></div>
<div class="toc"><span class="k">toc 220</span><div class="lines" style="margin-top:8px"><span style="width:80%"></span><span style="width:60%"></span></div></div>
</div></div>
<p style="margin:10px 0 0;color:var(--hm-text-muted)">Page gutter 24px, section rhythm 96px, content capped at 1320px. Sidebar and TOC are fixed; only prose flexes.</p>
</body></html>
