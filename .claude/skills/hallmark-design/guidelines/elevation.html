<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1"><div style="height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-3);box-shadow:var(--shadow-1)"></div><code style="display:block;margin-top:6px">1 · resting card</code></div><div style="flex:1"><div style="height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-3);box-shadow:var(--shadow-2)"></div><code style="display:block;margin-top:6px">2 · hover</code></div><div style="flex:1"><div style="height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-3);box-shadow:var(--shadow-3)"></div><code style="display:block;margin-top:6px">3 · overlay</code></div><div style="flex:1"><div style="height:56px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-3);box-shadow:var(--shadow-struck)"></div><code style="display:block;margin-top:6px">struck · pressed</code></div></div></body></html>
