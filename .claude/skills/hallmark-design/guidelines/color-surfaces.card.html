<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & lines" subtitle="Semantic aliases: what to reach for in a component" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.tile{flex:1;min-height:72px;border-radius:var(--hm-radius-3);padding:10px;font-family:var(--hm-font-mono);font-size:var(--hm-size-label);color:var(--hm-text-muted)}</style></head>
<body><div class="row">
<div class="tile" style="background:var(--hm-surface-page);border:var(--hm-border)">--hm-surface-page</div>
<div class="tile" style="background:var(--hm-surface-sunk);border:var(--hm-border)">--hm-surface-sunk</div>
<div class="tile" style="background:var(--hm-surface-raised);box-shadow:var(--hm-shadow-2)">--hm-surface-raised</div>
<div class="tile" style="background:var(--hm-surface-accent-soft);border:1px solid var(--hm-madder-200);color:var(--hm-madder-600)">--hm-surface-accent-soft</div>
<div class="tile" style="background:var(--hm-surface-inverse);color:var(--hm-ink-300)">--hm-surface-inverse</div>
</div>
<div class="row" style="margin-top:12px;align-items:center">
<span class="k">line</span><span style="flex:1;border-top:var(--hm-border)"></span>
<span class="k">hairline</span><span style="flex:1;border-top:var(--hm-border-hairline)"></span>
<span class="k">strike</span><span style="flex:1;border-top:var(--hm-strike)"></span>
</div></body></html>
