<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Hairline first, one soft shadow at most" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.e{flex:1;height:74px;background:var(--hm-surface-raised);border-radius:var(--hm-radius-3);padding:10px;display:flex;align-items:flex-end}</style></head>
<body><div class="row" style="gap:16px;padding:4px">
<div class="e" style="border:var(--hm-border);box-shadow:none"><span class="k">flat · hairline</span></div>
<div class="e" style="box-shadow:var(--hm-shadow-1)"><span class="k">shadow-1 · rest</span></div>
<div class="e" style="box-shadow:var(--hm-shadow-2)"><span class="k">shadow-2 · hover</span></div>
<div class="e" style="box-shadow:var(--hm-shadow-3)"><span class="k">shadow-3 · overlay</span></div>
</div>
<p style="margin:10px 4px 0;color:var(--hm-text-muted)">Cards rest at hairline or shadow-1. shadow-3 belongs only to things that float above the page: dropdowns, dialogs, the search overlay.</p>
</body></html>
