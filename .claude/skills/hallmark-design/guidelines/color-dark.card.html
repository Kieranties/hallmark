<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme" subtitle="[data-theme='dark'] — Docusaurus respects prefers-color-scheme" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head>
<body style="background:var(--hm-paper)"><div class="row">
<div class="sw" style="background:var(--hm-paper);color:var(--hm-ink-800);box-shadow:inset 0 0 0 1px var(--hm-line)"><b>page</b><span>#141110</span></div>
<div class="sw" style="background:var(--hm-surface-raised);color:var(--hm-ink-800)"><b>raised</b><span>#1F1A18</span></div>
<div class="sw" style="background:var(--hm-ink-200);color:var(--hm-ink-800)"><b>line</b><span>#302925</span></div>
<div class="sw" style="background:var(--hm-madder-500);color:#141110"><b>action</b><span>#DB6B44</span></div>
<div class="sw" style="background:var(--hm-verdigris-500);color:#141110"><b>verified</b><span>#67B7A4</span></div>
<div class="sw" style="background:var(--hm-brass-500);color:#141110"><b>open</b><span>#D2B268</span></div>
<div class="sw" style="background:var(--hm-aubergine-500);color:#141110"><b>conceded</b><span>#C094B4</span></div>
</div>
<p style="margin:12px 0 0;color:var(--hm-text-muted)">Dark is a lift, not an inversion: hues warm and lighten, paper stays brown-black, madder becomes a terracotta so links stay legible.</p>
</body></html>
