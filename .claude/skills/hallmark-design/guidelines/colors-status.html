<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="lbl">Verdigris · punch red · amber</div><div class="sw"><div style="background:var(--green-400);color:#fff">pass</div><div style="background:var(--green-100);color:#12463D">pass soft</div><div style="background:var(--red-400);color:#fff">fail</div><div style="background:var(--red-100);color:#6B221A">fail soft</div><div style="background:var(--amber-400);color:#fff">conceded</div><div style="background:var(--amber-100);color:#54400F">conceded soft</div></div></body></html>
