;height:32px;background:var(--accent);opacity:.85"></div><code style="display:block;margin-top:4px">32</code></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--accent);opacity:.85"></div><code style="display:block;margin-top:4px">48</code></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--accent);opacity:.85"></div><code style="display:block;margin-top:4px">64</code></div><div style="text-align:center"><div style="width:96px;height:96px;background:var(--accent);opacity:.85"></div><code style="display:block;margin-top:4px">96</code></div></div></body></html>
