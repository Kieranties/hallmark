<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="max-width:60ch"><div style="font-family:var(--font-display);font-size:26px;color:var(--text-heading)">Standards</div><div style="height:3px;width:44px;background:var(--accent);margin:8px 0 12px"></div><p style="margin:0;font-size:14px;line-height:1.65;color:var(--text-muted)">A 3px gold rule, 44px wide, sits under section headings. It is the only place a solid gold bar appears in body content.</p></div></body></html>
