<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);color:var(--text-body);font-family:var(--font-sans);padding:14px 16px}.sw{display:flex;gap:0;border:1px solid var(--border-subtle);border-radius:var(--radius-2);overflow:hidden}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px"><div data-theme="light" style="flex:1;background:var(--paper-1);border:1px solid var(--paper-3);border-radius:var(--radius-3);padding:12px"><div style="font-family:var(--font-display);font-size:18px;color:var(--grey-1)">Provable</div><div style="font-size:13px;color:var(--grey-3);margin-top:4px">If something is claimed, there must be <span style="color:var(--gold-500);border-bottom:1px dotted var(--gold-400)">evidence</span>.</div></div><div data-theme="dark" style="flex:1;background:var(--ink-1);border:1px solid var(--ink-3);border-radius:var(--radius-3);padding:12px"><div style="font-family:var(--font-display);font-size:18px;color:var(--grey-7)">Provable</div><div style="font-size:13px;color:var(--grey-5);margin-top:4px">If something is claimed, there must be <span style="color:var(--gold-300);border-bottom:1px dotted var(--gold-300)">evidence</span>.</div></div></div></body></html>
