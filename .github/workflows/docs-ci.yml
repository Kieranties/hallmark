name: Docs CI

# Pull requests build the site but never publish it.
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs-*.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request build is waste — cancel it.
concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml
