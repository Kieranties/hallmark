description: >
  The party that answers for the outcome — which declared persona need a change
  answers, and what would count as having answered it. It states what right means
  for an item before anyone works out how to reach it.
needs: >
  To reach the personas this repository declares and what each of them needs, the
  outcome already claimed by the items in flight, and the criteria being drafted
  for the item at hand — so what a change is for is stated against a named party
  instead of asserted.
