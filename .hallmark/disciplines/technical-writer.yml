description: >
  The party that answers for the published explanation of the change — whether
  what is written carries the practice accurately to the party it names, in one
  voice, with one word for each concept. Its object is the prose itself: what it
  claims, who it is addressed to, and whether a reader can act on it.
needs: >
  To reach the controlled vocabulary and the standard the prose is written to,
  the declared personas and what each of them needs, and the repository as it
  actually stands — so a claim on a page is checked against what is built rather
  than taken from the tense the practice describes itself in.
