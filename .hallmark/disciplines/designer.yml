description: >
  The party that answers for what a served party sees and does — the wording,
  ordering and naming of every step, skill, declaration and message somebody acts
  on. Its question is whether the thing reads the way it works.
needs: >
  To reach the artifacts an actor actually encounters, and the record of where
  use has gone wrong — the name reached for that was not the name given, the step
  that stalls a reader it assumed too much about — so wording is corrected from
  observed use rather than from taste.
