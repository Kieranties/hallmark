description: >
  The party that answers for sequencing and flow — whether an item is to be done
  at all, when it travels, and what this repository has committed to. It sifts
  what arrives at the door and it holds the door's own configuration.
needs: >
  To reach the door's contents and the state of every item in it, the versions
  committed and what stands against each, and every concession still open — so a
  ruling on what travels next is taken from the board's real contents rather than
  from what is recalled of them.
